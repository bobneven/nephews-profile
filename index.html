<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Persoonlijke landingspagina van Bob Neven voor nephews, met LinkedIn en contact."
    />
    <title>Bob Neven | nephews</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <header class="topbar">
        <img
          class="logo"
          src="assets/logo-nephews-transparent-white.png"
          alt="nephews logo"
        />
      </header>

      <section class="profile-card" aria-label="Persoonlijk profiel">
        <div class="identity">
          <h1>Bob Neven</h1>
          <p class="role">HealthTech Go-to-Market &amp; Product Strategy</p>
          <p class="location">Belgium</p>
        </div>

        <nav class="contact" aria-label="Contactgegevens">
          <a class="button" href="mailto:bob.neven@nephewsbv.com">
            <svg class="mail-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4.5 6.75h15A1.5 1.5 0 0 1 21 8.25v7.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 15.75v-7.5a1.5 1.5 0 0 1 1.5-1.5Zm.34 1.5 6.34 4.45a1.42 1.42 0 0 0 1.64 0l6.34-4.45H4.84Zm14.66 1.72-5.82 4.08a2.91 2.91 0 0 1-3.36 0L4.5 9.97v5.78h15V9.97Z"
              />
            </svg>
            Contact me
          </a>
          <a
            class="button primary"
            href="https://www.linkedin.com/in/bobneven"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn profile"
          >
            <svg class="linkedin-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14Zm1.78 13.02H3.54V9H7.1v11.45Z"
              />
            </svg>
            LinkedIn
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
